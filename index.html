<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meine Spiele</title>
  <meta name="description" content="Meine Steam-Spiele: Bibliothek und Wunschliste verwalten.">
  <meta name="theme-color" content="#f6f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spiele">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="kopf">
    <div class="kopf-zeile">
      <h1>Meine Spiele</h1>
      <button class="icon-knopf" id="menue-knopf" aria-label="Menü: Export, Import, Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <nav class="reiter" role="tablist">
      <button role="tab" class="reiter-knopf" data-reiter="bibliothek" aria-selected="true">Bibliothek <span class="zahl" id="zahl-bibliothek"></span></button>
      <button role="tab" class="reiter-knopf" data-reiter="wunschliste" aria-selected="false">Wunschliste <span class="zahl" id="zahl-wunschliste"></span></button>
    </nav>
  </header>

  <main>
    <section class="werkzeuge">
      <label class="suche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input type="search" id="suche" placeholder="Spiel suchen …" autocomplete="off" aria-label="Nach Namen suchen">
      </label>
      <div class="filter">
        <select id="filter-status" aria-label="Nach Status filtern"></select>
        <select id="filter-kategorie" aria-label="Nach Kategorie filtern"></select>
      </div>
      <label class="schalter" id="erledigte-zeile">
        <input type="checkbox" id="erledigte-aus">
        <span class="schalter-bahn" aria-hidden="true"></span>
        Erledigte ausblenden
      </label>
      <button class="knopf haupt breit" id="wuerfel-knopf">🎲 Was soll ich spielen?</button>
    </section>

    <div id="liste" aria-live="polite"></div>
  </main>

  <button class="fab" id="neu-knopf" aria-label="Spiel hinzufügen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <!-- Spiel bearbeiten / hinzufügen -->
  <dialog id="dlg-spiel" class="blatt">
    <form method="dialog" id="form-spiel">
      <h2 id="dlg-spiel-titel">Spiel bearbeiten</h2>
      <label class="feld">Name
        <input name="name" required maxlength="150">
      </label>
      <label class="feld">Kategorie
        <select name="kategorie" id="feld-kategorie"></select>
      </label>
      <div class="neue-kat" id="neue-kat" hidden>
        <label class="feld">Name der neuen Kategorie
          <input name="neueKatName" maxlength="80">
        </label>
        <label class="feld">Gehört zu
          <select name="neueKatBereich">
            <option value="Story-Wunsch">Bibliothek – Passt zu deinem Wunsch</option>
            <option value="Für andere Laune">Bibliothek – Für andere Laune</option>
            <option value="Wunschliste">Wunschliste</option>
          </select>
        </label>
        <label class="feld">Kurzbeschreibung (optional)
          <input name="neueKatInfo" maxlength="120">
        </label>
      </div>
      <div class="feld" id="feld-status-block">Status
        <div class="segmente" id="feld-status" role="radiogroup"></div>
      </div>
      <div class="feld">Bewertung
        <div class="sterne gross" id="feld-sterne" data-wert="0"></div>
      </div>
      <label class="feld">Eigene Notiz
        <input name="notiz" maxlength="200" placeholder="z. B. „Kapitel 3, Speicherstand Burg“">
      </label>
      <label class="feld">Bisherige Spielzeit
        <input name="spielzeit" maxlength="20" placeholder="z. B. 4,5 h oder 30 min">
      </label>
      <label class="feld">Beschreibung
        <textarea name="beschreibung" rows="4"></textarea>
      </label>
      <div class="knopf-zeile">
        <button type="button" class="knopf gefahr" id="loeschen-knopf">Löschen</button>
        <span class="platz"></span>
        <button type="button" class="knopf" data-schliessen>Abbrechen</button>
        <button type="submit" class="knopf haupt" value="ok">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Gekauft: Kategorie wählen -->
  <dialog id="dlg-gekauft" class="blatt">
    <form method="dialog" id="form-gekauft">
      <h2>In die Bibliothek</h2>
      <p id="gekauft-text"></p>
      <label class="feld">In welche Kategorie?
        <select name="kategorie" id="gekauft-kategorie"></select>
      </label>
      <div class="knopf-zeile">
        <span class="platz"></span>
        <button type="button" class="knopf" data-schliessen>Abbrechen</button>
        <button type="submit" class="knopf haupt" value="ok">Verschieben</button>
      </div>
    </form>
  </dialog>

  <!-- Zufallsvorschlag -->
  <dialog id="dlg-wuerfel" class="blatt">
    <form method="dialog" id="form-wuerfel">
      <h2>Was soll ich spielen?</h2>
      <label class="feld">Aus welcher Kategorie?
        <select id="wuerfel-kategorie"></select>
      </label>
      <label class="schalter">
        <input type="checkbox" id="wuerfel-angefangen">
        <span class="schalter-bahn" aria-hidden="true"></span>
        Angefangene auch vorschlagen
      </label>
      <div id="wuerfel-ergebnis" class="ergebnis" aria-live="polite"></div>
      <div class="knopf-zeile">
        <button type="button" class="knopf" data-schliessen>Schließen</button>
        <span class="platz"></span>
        <button type="button" class="knopf" id="wuerfel-los">🎲 Würfeln</button>
        <button type="button" class="knopf haupt" id="wuerfel-nehmen" hidden>Spiel ich!</button>
      </div>
    </form>
  </dialog>

  <!-- Menü -->
  <dialog id="dlg-menue" class="blatt">
    <div class="menue">
      <h2>Daten</h2>
      <p class="leise" id="menue-info"></p>
      <button class="knopf breit" id="export-knopf">⬇️ Als Datei exportieren</button>
      <button class="knopf breit" id="teilen-knopf" hidden>📤 Datei teilen (z. B. an den PC schicken)</button>
      <button class="knopf breit" id="import-knopf">⬆️ Datei importieren</button>
      <input type="file" id="import-datei" accept=".json,application/json" hidden>
      <p class="leise klein">Export und Import übertragen alle Spiele, Status, Notizen und Bewertungen zwischen Handy und PC. Ein Import ersetzt die Daten auf diesem Gerät.</p>
      <hr>
      <button class="knopf breit gefahr-text" id="reset-knopf">Auf Startdaten zurücksetzen</button>
      <div class="knopf-zeile">
        <span class="platz"></span>
        <button class="knopf" data-schliessen>Schließen</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="toast-knopf" id="toast-knopf" hidden>Rückgängig</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
